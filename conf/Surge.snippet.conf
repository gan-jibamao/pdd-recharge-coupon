; ===== 拼多多 30 元话费券 · 配置片段 =====
; 合并进你自己的 Surge 配置的 [Script] 段。
; 本地脚本不会自动更新：改了脚本内容必须重新粘贴进 Surge 的脚本编辑器。

[Script]
; Cookie 采集：只按 4 个核心字段判登录态，不读 body
拼多多Cookie采集   = type=http-request,pattern=^https?:\/\/m\.pinduoduo\.net,script-path=pdd-cookie-capture.js,timeout=5
拼多多Cookie采集YKD = type=http-request,pattern=^https?:\/\/mobile\.yangkeduo\.com\/proxy\/,script-path=pdd-cookie-capture.js,timeout=5

; 主流程：23:59:50 起静默 → 00:00:01.05 单发；限流 15s/45s 退避，单窗口封顶 3 发
拼多多话费券 = type=cron,cronexp=59 23 * * *,script-path=pdd-recharge-coupon.js,timeout=90,wake-system=true
; 补枪 00:02：券池是分钟级寿命，中段才是主战场
拼多多补枪 = type=cron,cronexp=2 0 * * *,script-path=pdd-recharge-coupon.js,timeout=90,wake-system=true
; 白天签到保障：canSign 即补签，已领券（st=40）时补新周期第 1 天
拼多多签到保障 = type=cron,cronexp=0 12 * * *,script-path=pdd-recharge-coupon.js,timeout=60,wake-system=true

[Rule]
; 强制直连：避免共享代理出口 IP 被平台风控
DOMAIN-SUFFIX,pinduoduo.net,DIRECT

[MITM]
; 域名清单见 MITM.conf.example
